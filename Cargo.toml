[package]
name = "fsp-mint"
version = "0.8.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"

[dependencies]
# mint-core is pinned to its release tag.
mint-core = { git = "https://github.com/dav-anderson/mint-core.git", tag = "v0.2.0" }
mint-types = { git = "https://github.com/dav-anderson/mint-core.git", tag = "v0.2.0" }
bdhke = { git = "https://github.com/dav-anderson/mint-core.git", tag = "v0.2.0" }
# The wire types, shared with the other mints and the wallet. This is the only
# thing fsp-mint takes from the ESP side at run time: it talks to esp-mint over
# AIR (the only way) and does not link its code. `air-client` is the AIR request
# envelope, the checks on a reply and the transport, which needs `air_server`
# (see the [patch.crates-io] at the end).
sp-wire = { git = "https://github.com/dav-anderson/sp-wire.git", tag = "v0.5.1", features = ["air-client"] }
secp256k1 = { version = "0.30", default-features = false, features = ["global-context", "rand", "serde"] }
sha2 = "0.10"
hex = "0.4.3"
rand = "0.8.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "signal"] }

[dev-dependencies]
# The tests start a real esp-mint in the process, with its AIR listener, as the
# Issuer, and fsp-mint's own AIR listener beside it (they need an esp-mint that
# has `air_listener` and `EspState::open`: 0.7.0).
esp-mint = { git = "https://github.com/dav-anderson/esp-mint.git", tag = "v0.8.0" }
# What is left over HTTP is `/audit`, of this mint and of the in-process ESP mint:
# the tests read it.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[lib]
name = "fsp_mint"
path = "src/lib.rs"

[[bin]]
name = "fsp-mint"
path = "src/main.rs"

# For local work, put this in .cargo/config.toml (git-ignored) or uncomment it
# here and do not commit it. See the top-level README.
#
# [patch."https://github.com/dav-anderson/sp-wire.git"]
# sp-wire = { path = "../sp-wire" }
#
# [patch."https://github.com/dav-anderson/esp-mint.git"]
# esp-mint = { path = "../esp-mint" }
#
# [patch."https://github.com/dav-anderson/mint-core.git"]
# mint-core = { path = "../mint-core-v0.2.0/crates/mint-core" }
# mint-types = { path = "../mint-core-v0.2.0/crates/mint-types" }
# bdhke = { path = "../mint-core-v0.2.0/crypto/bdhke" }

# sp-wire's `air-client` builds air_server 1.0.1, which takes `air` 3.0.0 from
# crates.io. This points that at the AIR sp-wire pins (3.0.0 plus the `SecretKey`
# export), or two `air` crates are built and their types do not match. sp-wire has
# the same block, but a patch applies only in the crate being built.
[patch.crates-io]
air = { git = "https://github.com/ramp-stack/air", rev = "eae5133414fca493fa80ab3facf28248df9ad65d" }
