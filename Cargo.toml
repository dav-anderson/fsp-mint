[package]
name = "fsp-mint"
version = "0.6.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[dependencies]
# mint-core is pinned to its release tag.
mint-core = { git = "https://github.com/dav-anderson/mint-core.git", tag = "v0.1.3" }
mint-types = { git = "https://github.com/dav-anderson/mint-core.git", tag = "v0.1.3" }
bdhke = { git = "https://github.com/dav-anderson/mint-core.git", tag = "v0.1.3" }
mint-server = { git = "https://github.com/dav-anderson/mint-core.git", tag = "v0.1.3" }
# The wire types, shared with the other mints and the wallet. This is the only
# thing fsp-mint takes from the ESP side at run time: it talks to esp-mint over
# AIR (the only way) and does not link its code. `air-client` is the AIR request
# envelope, the checks on a reply and the transport, which needs `air_server`;
# until air_server stops naming `air` by a path outside its repository, a build
# takes the local patches below (the README, "Building").
sp-wire = { git = "https://github.com/dav-anderson/sp-wire.git", tag = "v0.4.0", features = ["air-client"] }
secp256k1 = { version = "0.30", default-features = false, features = ["global-context", "rand", "serde"] }
sha2 = "0.10"
hex = "0.4.3"
rand = "0.8.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "signal"] }

[dev-dependencies]
# The tests start a real esp-mint in the process, with its AIR listener, as the
# Issuer, and fsp-mint's own AIR listener beside it (they need an esp-mint that
# has `air_listener`, which no tag has yet: the local patch below).
esp-mint = { git = "https://github.com/dav-anderson/esp-mint.git", tag = "v0.5.0" }
# What is left over HTTP is `/audit`, of this mint and of the in-process ESP mint:
# the tests read it.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[lib]
name = "fsp_mint"
path = "src/lib.rs"

[[bin]]
name = "fsp-mint"
path = "src/main.rs"

# For local work, put this in .cargo/config.toml (git-ignored) or uncomment it
# here and do not commit it. See the top-level README.
#
# [patch."https://github.com/dav-anderson/sp-wire.git"]
# sp-wire = { path = "../sp-wire" }
#
# While sp-wire's AIR pin (3.0.0) has no `SecretKey` export upstream, AIR is taken
# from a local checkout that has it:
# [patch."https://github.com/ramp-stack/air"]
# air = { path = "../air" }
#
# sp-wire's `air-client` needs air_server. It names `air` as `path = "../air"`, so
# the checkout must sit beside the `air` above (the air patch path must be
# `<air_server>/../air`):
# [patch."https://github.com/ramp-stack/air_server"]
# air_server = { path = "../air_server" }
#
# [patch."https://github.com/dav-anderson/esp-mint.git"]
# esp-mint = { path = "../esp-mint" }
#
# [patch."https://github.com/dav-anderson/mint-core.git"]
# mint-core = { path = "../mint-core-v0.1.3/crates/mint-core" }
# mint-types = { path = "../mint-core-v0.1.3/crates/mint-types" }
# bdhke = { path = "../mint-core-v0.1.3/crypto/bdhke" }
# mint-server = { path = "../mint-core-v0.1.3/server" }
